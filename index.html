<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق لوكال | Souk Local</title>
    
    <!-- Firebase App (Core) and Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand" onclick="clearStoreFilter()">
                <div class="brand-icon">🛒</div>
                <h1 id="brandTitle">سوق لوكال | Souk Local</h1>
            </div>
            <div class="header-actions">
                <div class="lang-switcher">
                    <button class="lang-btn active" onclick="setLang('ar')">AR</button>
                    <button class="lang-btn" onclick="setLang('fr')">FR</button>
                    <button class="lang-btn" onclick="setLang('en')">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="controls-bar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج، متجر، أو حي..." oninput="renderProducts()">
        </div>
        <div class="action-btns">
            <button class="btn-secondary" id="openStoreModalBtn" onclick="toggleStoreModal(true)">🏪 متجري</button>
            <button class="btn-primary" id="openModalBtn" onclick="toggleModal(true)">+ نشر منتج</button>
        </div>
    </div>

    <div class="categories" id="categoryContainer">
        <!-- Rendered via JS -->
    </div>

    <div class="view-container" id="mainViewContainer">
        <!-- Dynamic content or Store banner -->
        <main class="product-grid" id="productGrid">
            <!-- Rendered via JS -->
        </main>
    </div>

    <!-- Post Product Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">نشر منتج جديد</h3>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>
            <form id="productForm" onsubmit="handlePostProduct(event)">
                <div class="form-group">
                    <label id="lblStoreName">اسم متجرك (مثال: متجر الهواتف الذكية)</label>
                    <input type="text" id="prodStoreName" required placeholder="اسم المحجر أو البائع">
                </div>
                <div class="form-group">
                    <label id="lblTitle">اسم المنتج</label>
                    <input type="text" id="prodTitle" required placeholder="مثال: هاتف ذكي، حذاء رياضي...">
                </div>
                <div class="form-group">
                    <label id="lblPrice">السعر (أوقية / MRU)</label>
                    <input type="text" id="prodPrice" required placeholder="مثال: 5000 MRU">
                </div>
                <div class="form-group">
                    <label id="lblCat">التصنيف</label>
                    <select id="prodCategory" required>
                        <option value="electronics">إلكترونيات | Électronique</option>
                        <option value="fashion">أزياء وملابس | Mode</option>
                        <option value="home">منزل وديكور | Maison</option>
                        <option value="food">مواد غذائية | Alimentation</option>
                        <option value="services">خدمات | Services</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lblLoc">المنطقة / الحي</label>
                    <input type="text" id="prodLocation" required placeholder="تفرغ زينه، نواكشوط">
                </div>
                <div class="form-group">
                    <label id="lblPhone">رقم الهاتف (واتساب - يبدأ ب 2 أو 3 أو 4)</label>
                    <input type="text" id="prodPhone" required placeholder="22123456">
                </div>
                <div class="form-group">
                    <label id="lblPin">رمز الحذف السري (4 أرقام)</label>
                    <input type="password" id="prodPin" maxlength="4" required placeholder="1234">
                </div>
                <div class="form-group">
                    <label id="lblImage">صورة المنتج</label>
                    <input type="file" id="prodImage" accept="image/*" required onchange="handleImageUpload(event)">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;" id="lblSubmit">نشر المنتج الآن</button>
            </form>
        </div>
    </div>

    <!-- Store Profile Setup Modal -->
    <div class="modal" id="storeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="storeModalTitle">إنشاء أو زيارة صفحة متجرك</h3>
                <button class="close-btn" onclick="toggleStoreModal(false)">&times;</button>
            </div>
            <div class="form-group">
                <label id="lblEnterStore">أدخل اسم متجرك لعرض جميع منتجاتك:</label>
                <input type="text" id="storeInputName" placeholder="مثال: متجر نواكشوط الإلكتروني">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="viewMyStore()" id="lblViewStore">عرض صفحة المتجر</button>
        </div>
    </div>

    <script>
        // TODO: Replace with your actual Firebase project configuration credentials
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Translations dictionary
        const t = {
            ar: {
                brand: "🛒 سوق لوكال | Souk Local",
                search: "ابحث عن منتج، متجر، أو حي...",
                postBtn: "نشر منتج",
                myStoreBtn: "متجري",
                modalTitle: "نشر منتج جديد",
                storeModalTitle: "إدارة أو زيارة صفحة المتجر",
                lblStoreName: "اسم المتجر أو البائع",
                lblTitle: "اسم المنتج",
                lblPrice: "السعر",
                lblCat: "التصنيف",
                lblLoc: "المنطقة / الحي",
                lblPhone: "رقم الهاتف (يبدأ ب 2 أو 3 أو 4)",
                lblPin: "رمز الحذف السري (4 أرقام)",
                lblImage: "صورة المنتج",
                lblSubmit: "نشر المنتج الآن",
                lblEnterStore: "أدخل اسم متجرك لعرض صفحتك الخاصة:",
                lblViewStore: "عرض صفحة المتجر",
                all: "الكل",
                waBtn: "اطلب عبر واتساب",
                empty: "لا توجد منتجات منشورة حتى الآن. كن أول بائع ينشر منتجاً!",
                deleteBtn: "حذف",
                phoneError: "رقم الهاتف غير صحيح في موريتانيا! يجب أن يتكون من 8 أرقام ويبدأ بـ 2 أو 3 أو 4.",
                pinPrompt: "أدخل رمز الحذف المكون من 4 أرقام لحذف هذا المنتج:",
                wrongPin: "رمز الحذف غير صحيح!"
            },
            fr: {
                brand: "🛒 Souk Local",
                search: "Rechercher un produit, boutique...",
                postBtn: "Publier",
                myStoreBtn: "Ma Boutique",
                modalTitle: "Publier un article",
                storeModalTitle: "Visiter votre boutique",
                lblStoreName: "Nom de la boutique",
                lblTitle: "Nom du produit",
                lblPrice: "Prix",
                lblCat: "Catégorie",
                lblLoc: "Quartier / Ville",
                lblPhone: "Téléphone (2, 3 ou 4)",
                lblPin: "Code PIN (4 chiffres)",
                lblImage: "Image du produit",
                lblSubmit: "Publier maintenant",
                lblEnterStore: "Entrez le nom de votre boutique :",
                lblViewStore: "Afficher la boutique",
                all: "Tous",
                waBtn: "WhatsApp",
                empty: "Aucun produit publié. Soyez le premier !",
                deleteBtn: "Supprimer",
                phoneError: "Numéro invalide ! 8 chiffres commençant par 2, 3 ou 4.",
                pinPrompt: "Entrez le code PIN :",
                wrongPin: "Code PIN incorrect !"
            },
            en: {
                brand: "🛒 Souk Local",
                search: "Search products, shops, neighborhoods...",
                postBtn: "Post Item",
                myStoreBtn: "My Store",
                modalTitle: "Post New Product",
                storeModalTitle: "Visit Your Store Page",
                lblStoreName: "Store / Seller Name",
                lblTitle: "Product Name",
                lblPrice: "Price",
                lblCat: "Category",
                lblLoc: "Neighborhood / Location",
                lblPhone: "Phone Number (starts with 2, 3, or 4)",
                lblPin: "4-Digit Delete PIN",
                lblImage: "Product Image",
                lblSubmit: "Publish Now",
                lblEnterStore: "Enter your store name to view your profile:",
                lblViewStore: "View Store Page",
                all: "All",
                waBtn: "WhatsApp",
                empty: "No products posted yet. Be the first merchant!",
                deleteBtn: "Delete",
                phoneError: "Invalid Mauritanian number! Must be 8 digits starting with 2, 3, or 4.",
                pinPrompt: "Enter 4-digit delete PIN:",
                wrongPin: "Incorrect PIN!"
            }
        };

        const cats = {
            ar: { all: "الكل", electronics: "إلكترونيات", fashion: "أزياء", home: "منزل", food: "مواد غذائية", services: "خدمات" },
            fr: { all: "Tous", electronics: "Électronique", fashion: "Mode", home: "Maison", food: "Alimentation", services: "Services" },
            en: { all: "All", electronics: "Electronics", fashion: "Fashion", home: "Home", food: "Food", services: "Services" }
        };

        let currentLang = 'ar';
        let activeCategory = 'all';
        let activeStoreFilter = null; // Filter by specific store page
        let uploadedImageBase64 = '';
        let products = [];

        // Real-time Firestore Sync
        db.collection('products').onSnapshot((snapshot) => {
            products = [];
            snapshot.forEach((doc) => {
                products.push({ id: doc.id, ...doc.data() });
            });
            renderProducts();
        });

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('brandTitle').innerText = t[lang].brand;
            document.getElementById('searchInput').placeholder = t[lang].search;
            document.getElementById('openModalBtn').innerHTML = `+ ${t[lang].postBtn}`;
            document.getElementById('openStoreModalBtn').innerText = `🏪 ${t[lang].myStoreBtn}`;
            document.getElementById('modalTitle').innerText = t[lang].modalTitle;
            document.getElementById('storeModalTitle').innerText = t[lang].storeModalTitle;
            document.getElementById('lblStoreName').innerText = t[lang].lblStoreName;
            document.getElementById('lblTitle').innerText = t[lang].lblTitle;
            document.getElementById('lblPrice').innerText = t[lang].lblPrice;
            document.getElementById('lblCat').innerText = t[lang].lblCat;
            document.getElementById('lblLoc').innerText = t[lang].lblLoc;
            document.getElementById('lblPhone').innerText = t[lang].lblPhone;
            document.getElementById('lblPin').innerText = t[lang].lblPin;
            document.getElementById('lblImage').innerText = t[lang].lblImage;
            document.getElementById('lblSubmit').innerText = t[lang].lblSubmit;
            document.getElementById('lblEnterStore').innerText = t[lang].lblEnterStore;
            document.getElementById('lblViewStore').innerText = t[lang].lblViewStore;

            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const currentCats = cats[currentLang];
            let html = `<div class="cat-chip ${activeCategory === 'all' && !activeStoreFilter ? 'active' : ''}" onclick="clearStoreFilter()">${currentCats.all}</div>`;
            
            for (let key in currentCats) {
                if (key !== 'all') {
                    html += `<div class="cat-chip ${activeCategory === key && !activeStoreFilter ? 'active' : ''}" onclick="filterCat('${key}')">${currentCats[key]}</div>`;
                }
            }
            container.innerHTML = html;
        }

        function filterCat(cat) {
            activeStoreFilter = null;
            activeCategory = cat;
            renderCategories();
            renderProducts();
        }

        function clearStoreFilter() {
            activeStoreFilter = null;
            activeCategory = 'all';
            renderCategories();
            renderProducts();
        }

        function filterByStore(storeName) {
            activeStoreFilter = storeName;
            renderCategories();
            renderProducts();
        }

        function toggleModal(open) {
            document.getElementById('postModal').classList.toggle('open', open);
            if(!open) {
                document.getElementById('productForm').reset();
                uploadedImageBase64 = '';
            }
        }

        function toggleStoreModal(open) {
            document.getElementById('storeModal').classList.toggle('open', open);
        }

        function viewMyStore() {
            const name = document.getElementById('storeInputName').value.trim();
            if (!name) {
                alert("Please enter a store name!");
                return;
            }
            toggleStoreModal(false);
            filterByStore(name);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function handlePostProduct(e) {
            e.preventDefault();

            const storeName = document.getElementById('prodStoreName').value.trim();
            const title = document.getElementById('prodTitle').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const category = document.getElementById('prodCategory').value;
            const location = document.getElementById('prodLocation').value.trim();
            const phone = document.getElementById('prodPhone').value.trim();
            const pin = document.getElementById('prodPin').value;

            const phoneRegex = /^[234]\d{7}$/;
            if (!phoneRegex.test(phone)) {
                alert(t[currentLang].phoneError);
                return;
            }

            if (!uploadedImageBase64) {
                alert(t[currentLang].lblImage + "!");
                return;
            }

            const newProduct = {
                storeName,
                title,
                price,
                category,
                location,
                phone,
                pin,
                image: uploadedImageBase64,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('products').add(newProduct)
                .then(() => {
                    toggleModal(false);
                })
                .catch((error) => {
                    console.error("Error adding product: ", error);
                    alert("Error posting product. Check console.");
                });
        }

        function deleteProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const enteredPin = prompt(t[currentLang].pinPrompt);
            if (enteredPin === product.pin) {
                db.collection('products').doc(id).delete()
                    .then(() => {
                        console.log("Deleted successfully!");
                    })
                    .catch((error) => {
                        console.error("Error removing product: ", error);
                    });
            } else {
                alert(t[currentLang].wrongPin);
            }
        }

        function renderProducts() {
            const container = document.getElementById('mainViewContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = products.filter(p => {
                const matchesStore = !activeStoreFilter || (p.storeName && p.storeName.toLowerCase() === activeStoreFilter.toLowerCase());
                const matchesCat = activeStoreFilter || (activeCategory === 'all' || p.category === activeCategory);
                const matchesSearch = (p.title && p.title.toLowerCase().includes(searchVal)) || 
                                      (p.location && p.location.toLowerCase().includes(searchVal)) ||
                                      (p.storeName && p.storeName.toLowerCase().includes(searchVal));
                return matchesStore && matchesCat && matchesSearch;
            });

            let htmlContent = '';

            // If viewing a specific store, show a gorgeous store banner at the top!
            if (activeStoreFilter) {
                htmlContent += `
                    <div class="store-header-banner">
                        <div class="store-header-info">
                            <h2>🏪 ${activeStoreFilter}</h2>
                            <p>صفحة المتجر الرسمية — عرض جميع المنتجات المعروضة من هذا البائع</p>
                        </div>
                        <button class="btn-secondary" onclick="clearStoreFilter()">← العودة للكل</button>
                    </div>
                `;
            }

            if (filtered.length === 0) {
                htmlContent += `
                    <div class="empty-state">
                        <h3>لا توجد منتجات</h3>
                        <p>${t[currentLang].empty}</p>
                    </div>
                `;
            } else {
                htmlContent += `<div class="product-grid">`;
                filtered.forEach(p => {
                    const waText = encodeURIComponent(`Hello, I want to buy your product: ${p.title} (${p.price}) listed in Souk Local.`);
                    htmlContent += `
                        <div class="product-card">
                            <div class="product-img-wrapper">
                                <img src="${p.image}" alt="${p.title}" class="product-img">
                                <span class="product-cat-badge">${cats[currentLang][p.category] || p.category}</span>
                            </div>
                            <div class="product-body">
                                <span class="store-tag" onclick="filterByStore('${p.storeName}')">🏪 ${p.storeName || 'متجر عام'}</span>
                                <h3 class="product-title">${p.title}</h3>
                                <div class="product-price">${p.price}</div>
                                <div class="product-loc">📍 ${p.location}</div>
                                <div class="card-actions">
                                    <a href="https://wa.me/222${p.phone}?text=${waText}" target="_blank" class="wa-btn">💬 ${t[currentLang].waBtn}</a>
                                    <button class="delete-card-btn" onclick="deleteProduct('${p.id}')">${t[currentLang].deleteBtn}</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</div>`;
            }

            container.innerHTML = htmlContent;
        }

        // Initial render call
        renderCategories();
    </script>
</body>
</html>
